<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR VIP KOPP🎮</title>
<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI,Arial,sans-serif;
    background:#000;
}

#bgWrap{position:fixed; inset:0;}
#bgFrame{width:100%; height:100%; border:none;}

.panel{
    position:fixed;
    width:130px;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(180deg,#050b18,#020816);
    color:white;
    z-index:2;
}

.panel::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    background:linear-gradient(45deg,red,orange,yellow,green,cyan,blue,purple,red);
    background-size:400% 400%;
    animation:rgb 6s linear infinite;
    filter:blur(6px);
    z-index:-1;
}

@keyframes rgb{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.hidden{display:none;}
.dragTitle{
    text-align:center;
    font-weight:700;
    color:#00ffd5;
    margin-bottom:10px;
    cursor:grab;
    user-select:none;
}
input{
    width:88%;
    padding:9px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#0b1d2b;
    color:white;
    font-size:14px;
    margin-bottom:10px;
    text-align:center;
}
.btn{
    width:100%;
    padding:9px;
    border:none;
    border-radius:10px;
    background:#00ffd5;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}
.timerBox{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#061826;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:10px;
    box-shadow:inset 0 0 10px rgba(0,255,213,0.4);
    font-weight:500;
}
.timerBox span{font-size:14px;color:#00ffd5;}
.timerBox .timer{font-size:24px;color:#ffd700;font-weight:800;}
.outerBox{
    padding:3px;
    border-radius:14px;
    background:linear-gradient(45deg,red,orange,yellow,green,cyan,blue,purple);
    background-size:400% 400%;
    animation:rgb 6s linear infinite;
    margin-bottom:10px;
}
.innerBox{
    background:#061826;
    border-radius:12px;
    padding:14px;
    text-align:center;
    font-size:28px;
    font-weight:600;
}
.tg{background:#229ED9;color:white;}
#minimizedIcon{
    position:fixed;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#00ffd5;
    color:#000;
    display:none;
    justify-content:center;
    align-items:center;
    font-weight:700;
    font-size:14px;
    z-index:999;
    cursor:grab;
    user-select:none;
}
</style>
</head>
<body>

<div id="bgWrap">
    <iframe id="bgFrame" src="https://www.amarclub8.com/#/register?invitationCode=684831297173"></iframe>
</div>

<div class="panel" id="loginPage">
    <div class="dragTitle">MR VIP HACK🎮</div>
    <input type="password" id="password" placeholder="Password">
    <button class="btn" id="loginBtn">Unlock</button>
    <p id="error" style="color:red;text-align:center;"></p>
</div>

<div class="panel hidden" id="mainPage">
    <div class="dragTitle">MAHIR VIP HACK🎮</div>

    <div class="timerBox">
        <span>TIMER:-</span>
        <span class="timer" id="timer">30</span>
    </div>

    <div class="outerBox">
        <div class="innerBox" id="result">BIG</div>
    </div>

    <button class="btn tg" onclick="openTG()">Join Telegram</button>
</div>

<div id="minimizedIcon">😈</div>

<script>
function center(p){
    p.style.left = (innerWidth/2 - p.offsetWidth/2)+"px";
    p.style.top  = (innerHeight/4)+"px";
}
center(loginPage);
center(mainPage);

/* DRAG LOGIC */
let box=null, ox=0, oy=0, isDragging=false;

function start(e){
    e.preventDefault();
    box = e.target.classList.contains("dragTitle") ? e.target.parentElement : minimizedIcon;
    const ev = e.touches ? e.touches[0] : e;
    const r = box.getBoundingClientRect();
    ox = ev.clientX - r.left;
    oy = ev.clientY - r.top;
    isDragging = false;
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, {passive:false});
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
}

function move(e){
    if(!box) return;
    isDragging = true;
    const ev = e.touches ? e.touches[0] : e;
    let newX = ev.clientX - ox;
    let newY = ev.clientY - oy;
    const maxX = innerWidth - box.offsetWidth;
    const maxY = innerHeight - box.offsetHeight;
    box.style.left = Math.max(0,Math.min(newX,maxX))+"px";
    box.style.top  = Math.max(0,Math.min(newY,maxY))+"px";
}

function end(){
    box=null;
    isDragging=false;
}

/* LOGIN */
const PASSWORD="mrtm88";
loginBtn.onclick=()=>{
    if(password.value===PASSWORD){
        loginPage.classList.add("hidden");
        mainPage.classList.remove("hidden");
        setInterval(sync,1000);
    }else error.innerText="Wrong Password";
};

function sync(){
    const r=30-(new Date().getSeconds()%30);
    timer.innerText=r;
    if(r===30) result.innerText=Math.random()>0.5?"BIG":"SMALL";
}

function openTG(){
    window.open("https://t.me/+M5kGkHVGNNpkYTVl");
}
</script>

</body>
</html>
